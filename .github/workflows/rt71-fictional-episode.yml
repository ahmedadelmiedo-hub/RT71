name: الملف 71 - إنتاج حلقة خيالية

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "إنتاج النص والبيانات فقط من دون صوت أو فيديو"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rt71-fictional-episode
  cancel-in-progress: false

jobs:
  produce:
    name: إنشاء حلقة خيالية للمراجعة
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install media and narration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu torchaudio==2.5.1+cpu
          pip install -r requirements.txt

      - name: Restore private narrator reference
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          VOICE_REFERENCE_B64: ${{ secrets.VOICE_REFERENCE_B64 }}
        run: |
          test -n "$VOICE_REFERENCE_B64" || (echo "Missing VOICE_REFERENCE_B64 secret" && exit 1)
          mkdir -p .private/voice
          printf '%s' "$VOICE_REFERENCE_B64" | base64 --decode > .private/voice/reference.mp3
          ffprobe -v error .private/voice/reference.mp3

      - name: Generate reviewable episode artifact
        env:
          COQUI_TOS_AGREED: "1"
        run: |
          FLAGS=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then FLAGS="--dry-run"; fi
          python scripts/fictional_episode_pipeline.py \
            --project-root "$PWD" \
            --profile config/channel_profile.json \
            --output-dir storage/autopilot \
            $FLAGS

      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt71-episode-${{ github.run_number }}
          path: storage/autopilot/
          if-no-files-found: error
          retention-days: 14
