name: Personal Voice XTTS

on:
  workflow_dispatch:
    inputs:
      script_file:
        description: UTF-8 Arabic script path
        required: true
        default: content/scripts/long/case-001-EP01.txt
      output_name:
        description: Output file stem
        required: true
        default: personal-voice-test

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install FFmpeg and XTTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements-xtts.txt

      - name: Restore private voice reference
        shell: bash
        env:
          VOICE_REFERENCE_B64: ${{ secrets.VOICE_REFERENCE_B64 }}
        run: |
          test -n "$VOICE_REFERENCE_B64" || (echo "Missing VOICE_REFERENCE_B64 secret" && exit 1)
          mkdir -p .private/voice
          printf '%s' "$VOICE_REFERENCE_B64" | base64 --decode > .private/voice/reference.wav
          ffprobe -v error .private/voice/reference.wav

      - name: Generate narration in owner's voice
        run: |
          python -m core.voice_clone \
            --script-file "${{ inputs.script_file }}" \
            --reference-audio .private/voice/reference.wav \
            --output "storage/autopilot/${{ inputs.output_name }}.mp3"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: storage/autopilot/${{ inputs.output_name }}.mp3
          if-no-files-found: error
          retention-days: 7
